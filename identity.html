<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identificação de Usuário</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      color: #f9fafb;
      padding: 1rem;
    }
    .card {
      width: 100%;
      max-width: 27.5rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.875rem;
      padding: 1rem;
      box-shadow: 0 10px 35px rgba(0, 0, 0, .35);
    }
    h1 {
      font-size: 1.375rem;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }
    p {
      font-size: 0.875rem;
      color: #cbd5e1;
      margin-bottom: 1rem;
      line-height: 1.5;
    }
    label {
      display: block;
      font-weight: 700;
      font-size: 0.8125rem;
      margin-bottom: 0.5rem;
    }
    input,
    select {
      width: 100%;
      border: 1px solid #475569;
      background: #020617;
      color: #f8fafc;
      border-radius: 0.625rem;
      padding: 0.75rem;
      font-size: 1rem;
      margin-bottom: 0.75rem;
      outline: none;
    }
    input:focus,
    select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .2);
    }
    .value {
      width: 100%;
      border: 1px solid #475569;
      background: #020617;
      color: #f8fafc;
      border-radius: 0.625rem;
      padding: 0.75rem;
      font-size: 1rem;
      margin-bottom: 0.75rem;
      min-height: 2.875rem;
      display: flex;
      align-items: center;
    }
    .hidden {
      display: none;
    }
    button {
      width: 100%;
      border: 0;
      background: #2563eb;
      color: #fff;
      padding: 0.75rem;
      border-radius: 0.625rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s ease;
    }
    button:hover { background: #1d4ed8; }
    .error {
      display: none;
      margin-top: 0.75rem;
      font-size: 0.8125rem;
      color: #fca5a5;
    }
    .error.show { display: block; }

    @media (min-width: 640px) {
      body {
        padding: 1.5rem;
      }

      .card {
        padding: 1.5rem;
      }
    }

    @media (min-width: 768px) {
      .card {
        max-width: 30rem;
      }
    }

    @media (min-width: 1024px) {
      h1 {
        font-size: 1.5rem;
      }
    }

    @media (min-width: 1280px) {
      .card {
        max-width: 32rem;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Informe seu nome</h1>
    <p>Para usar o navegador, confirme os dados do usuário e selecione o departamento.</p>
    <label for="userName">Nome do usuário</label>
    <div id="userNameValue" class="value">Carregando usuário do Windows...</div>
    <input id="userName" class="hidden" type="text" autocomplete="name" placeholder="Digite seu nome" />
    <label for="userDepartment">Departamento</label>
    <select id="userDepartment">
      <option value="">Selecione um departamento</option>
      <option value="Fiscal">Fiscal</option>
      <option value="DP">DP</option>
      <option value="Recepção">Recepção</option>
      <option value="Contabil">Contabil</option>
      <option value="Legal">Legal</option>
      <option value="Administrativo">Administrativo</option>
    </select>
    <button id="saveUser">Continuar</button>
    <div id="error" class="error">Informe um nome de usuário e departamento válidos para continuar.</div>
  </main>
  <script src="identity.js"></script>
</body>
</html>

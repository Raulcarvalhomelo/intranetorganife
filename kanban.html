<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban desativado - Portal Corporativo</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 45%, #0b1220 100%);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.26);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 24px 70px rgba(2, 6, 23, 0.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
      color: #f8fafc;
    }
    p {
      margin: 0 0 1rem;
      color: #cbd5e1;
      line-height: 1.5;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 1rem;
      border-radius: 999px;
      background: #2A9D8F;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #238276; }
  </style>
</head>
<body>
  <main>
    <h1>Kanban desativado na extensão</h1>
    <p>O Kanban deixou de ser mantido dentro da extensão Organife. Use a nova aplicação dedicada para gestão de tarefas.</p>
    <a href="intranet.html">Voltar para a Intranet</a>
  </main>
</body>
</html>
